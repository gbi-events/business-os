<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* statistiques */
.stbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.stbar select,.stbar input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
.stdates{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.stseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stseg button{border:0;background:var(--surface);padding:7px 14px;font-weight:500;color:var(--ink)}
.stseg button+button{border-left:1px solid var(--line)}
.stseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.stkpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stkpis .kpi b{font-size:26px}
.stgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stgrid .card+.card{margin-top:0}
.chartbox{min-height:180px}
.chart{display:block;max-width:100%}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gl.base{stroke:var(--muted);opacity:.5}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .vl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--f-body)}
.chart path.b{fill:var(--accent)}
.chartbox.money .chart path.b{fill:var(--brass)}
.chart rect.hit{fill:transparent;cursor:default}
.chart g.col:hover path.b{opacity:.75}
#sttip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;z-index:80;white-space:nowrap;box-shadow:var(--shadow)}
.delta{font-weight:600}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.stgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stgrid3 .card+.card{margin-top:0}
.hb{display:flex;flex-direction:column;gap:7px}
.hbr{display:grid;grid-template-columns:minmax(80px,40%) 1fr auto;gap:8px;align-items:center;font-size:12.5px}
.hbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:12px;display:block}
.hbt i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.money .hbt i{background:var(--brass)}
.hbv{font-variant-numeric:tabular-nums;font-weight:600;min-width:42px;text-align:right}
.hbr:hover .hbt i{opacity:.75}
@media (max-width:1000px){.stgrid3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.stkpis{grid-template-columns:repeat(2,minmax(0,1fr))}.stgrid,.stgrid3{grid-template-columns:1fr}}

/* matériel : disponibilité */
.mbar{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--surface2);vertical-align:middle;overflow:hidden;margin-right:6px}
.mbar i{display:block;height:100%;background:var(--good);border-radius:4px}
.mbar i.part{background:var(--warn)}.mbar i.full{background:var(--bad)}
.mrange{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.mrange input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 6px;color:var(--ink)}
.cal{border-collapse:separate;border-spacing:3px;font-size:11px}
.cal th{font-weight:500;color:var(--muted);text-align:center;padding:0 0 2px;min-width:26px;line-height:1.15}
.cal th.we{color:var(--ink);font-weight:700}
.cal th.it{text-align:left}
.cal td.it{white-space:nowrap;padding-right:10px;font-size:12.5px;position:sticky;left:0;background:var(--surface);z-index:1}
.cal td.c{height:28px;min-width:26px;border-radius:6px;text-align:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.cal td.ok{background:var(--good-soft);color:var(--good)}
.cal td.part{background:var(--warn-soft);color:var(--warn)}
.cal td.full{background:var(--bad-soft);color:var(--bad)}
.cal td.unk{background:var(--surface2);color:var(--muted)}
.cal th.we span{display:inline-block;background:var(--ink);color:var(--bg);border-radius:5px;padding:1px 3px}
.calleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.calleg span{display:inline-flex;align-items:center;gap:5px}
.calleg i{display:inline-block;width:14px;height:14px;border-radius:4px;font-style:normal;font-size:9px;font-weight:700;text-align:center;line-height:14px}

/* recherche globale */
.gsearch{position:relative;flex:1 1 280px;max-width:440px}
.gsearch input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 34px;color:var(--ink);font-size:14px}
.gsearch input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.gsearch .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:14px}
#gsres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:70;max-height:70vh;overflow:auto}
#gsres button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 12px;color:var(--ink)}
#gsres button:last-child{border-bottom:0}
#gsres button:hover,#gsres button.on{background:var(--accent-soft)}
#gsres b{font-weight:600}
#gsres .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#gsres .none{padding:10px 12px;color:var(--muted);font-size:13px}
tr.dim td{color:var(--muted)}

/* aide */
#help{position:fixed;inset:0;background:rgba(10,18,15,.55);z-index:90;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;overflow:auto}
#help[hidden]{display:none}
#help .hp{background:var(--bg);color:var(--ink);border-radius:14px;max-width:860px;width:100%;box-shadow:var(--shadow);border:1px solid var(--line)}
#help .hh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px 14px 0 0;z-index:1}
#help .hh h2{font-size:20px}
#help .hb2{padding:16px 18px 22px}
#help .hnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
#help .hnav a{font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--surface)}
#help .hnav a:hover{border-color:var(--accent)}
#help section.card{scroll-margin-top:70px}
#help h3{font-size:16px}
#help p,#help li{font-size:14px;line-height:1.5}
#help ol,#help ul{margin:6px 0 0;padding-left:20px}
#help li+li{margin-top:4px}
.h3col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.h3col div{background:var(--surface2);border-radius:10px;padding:12px}
.h3col b{display:block;font-family:var(--f-display);font-size:16px;margin-bottom:2px}
.h3col span{font-size:13px;color:var(--muted)}
.hflow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 10px}
.hflow .arr{color:var(--muted)}
.hstages{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;font-size:14px}
.hg{border-top:1px solid var(--line);padding:2px 0}
.hg summary{cursor:pointer;font-weight:600;padding:9px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
.hg summary::-webkit-details-marker{display:none}
.hg summary::after{content:'+';font-size:18px;color:var(--muted);font-weight:400}
.hg[open] summary::after{content:'−'}
.hg[open]{padding-bottom:10px}
.hg .hs{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
@media (max-width:640px){.hlbl{display:none}.h3col{grid-template-columns:1fr}#help{padding:0}#help .hp{border-radius:0;min-height:100%}#help .hh{border-radius:0}}
</style></head><body>
<title>GBI Business OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: poste de commande de vente. Bandeau de chiffres, onglets, files d'action; fiche prospect en tiroir. */
:root{
  --bg:#F2F5F2; --surface:#FFFFFF; --surface2:#E8EEE9; --ink:#14211C; --muted:#5A6B63; --line:#D3DCD5;
  --accent:#0D6B58; --accent-ink:#FFFFFF; --accent-soft:#D8EEE7; --brass:#9A6F12; --brass-soft:#F4E7C6;
  --good:#1D7A45; --good-soft:#D9EFE1; --warn:#9A6A12; --warn-soft:#F6E8C8; --bad:#B03A2E; --bad-soft:#F6DAD6;
  --shadow:0 1px 2px rgba(20,33,28,.06),0 6px 20px rgba(20,33,28,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#151F1B; --surface2:#1D2A25; --ink:#E6EEE9; --muted:#93A59C; --line:#2A3A33;
  --accent:#3FBF9F; --accent-ink:#052018; --accent-soft:#17352D; --brass:#E0AE4A; --brass-soft:#3A2F14;
  --good:#58C386; --good-soft:#163523; --warn:#E3AA3E; --warn-soft:#3A2D12; --bad:#F0806F; --bad-soft:#3E1D19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#151F1B; --surface2:#1D2A25; --ink:#E6EEE9; --muted:#93A59C; --line:#2A3A33;
  --accent:#3FBF9F; --accent-ink:#052018; --accent-soft:#17352D; --brass:#E0AE4A; --brass-soft:#3A2F14;
  --good:#58C386; --good-soft:#163523; --warn:#E3AA3E; --warn-soft:#3A2D12; --bad:#F0806F; --bad-soft:#3E1D19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:22px}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--good)} .dot.off{background:var(--bad)}
nav#tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
nav#tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;white-space:nowrap;color:var(--muted);font-weight:500}
nav#tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav#tabs .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:600}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}
.kpis{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi .kl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi.hero .kl{color:inherit;opacity:.7}
.kpi b{font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.hero b{font-size:44px}
.kpi .ks{font-size:12px;color:var(--muted)}
.kpi.hero .ks{color:inherit;opacity:.8}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.card+.card{margin-top:14px}
.card h2,.card h3{margin-bottom:8px}
.muted{color:var(--muted)} .sm{font-size:12px}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--ink);white-space:nowrap}
.chip.hot{background:var(--accent-soft);color:var(--accent)} .chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brass{background:var(--brass-soft);color:var(--brass)} .chip.off{opacity:.45;font-weight:500}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ro [data-write]{pointer-events:none;opacity:.45}
.q-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer}
.q:hover{border-color:var(--accent)}
.q .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q .t b{overflow-wrap:anywhere}
.q .nx{grid-column:1/-1;font-size:13px;color:var(--muted)}
.q .btns{display:flex;gap:6px;align-items:center}
.callcard{border:2px solid var(--accent);border-radius:14px;padding:16px;background:var(--surface)}
.callcard h2{margin:0 0 4px;font-size:20px}
.callnum{display:inline-block;font-size:26px;font-weight:700;letter-spacing:.02em;margin:8px 0;text-decoration:none;color:var(--accent)}
.script{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin:10px 0}
.script b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.script b:first-child{margin-top:0}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.res .btn{padding:10px 8px;text-align:center}
.callstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.callstats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.callstats b{display:block;font-size:20px}
.callstats span{font-size:11.5px;color:var(--muted)}
.nophone{display:grid;grid-template-columns:minmax(0,1fr) 150px auto auto;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0;font-size:13px}
@media(max-width:640px){.nophone{grid-template-columns:1fr 1fr}.callstats{grid-template-columns:1fr 1fr}}
.sec-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.sec-label:first-child{margin-top:0}
.funnel{display:grid;gap:6px}
.fn{display:grid;grid-template-columns:96px 1fr 38px;gap:8px;align-items:center;font-size:12.5px}
.fn .bar{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.fn .bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.fn span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ev{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border:0}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border-radius:12px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col h3{font-size:13px;display:flex;justify-content:space-between;gap:6px;padding:2px 4px}
.col h3 small{font-weight:500;color:var(--muted)}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pc:hover{border-color:var(--accent)}
.pc b{overflow-wrap:anywhere}
.bar-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar-tools input,.bar-tools select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.bar-tools input[type=search]{flex:1 1 200px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.4fr) minmax(0,1.6fr);gap:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;align-items:center}
.row:hover{border-color:var(--accent)}
.row .m{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.row b{overflow-wrap:anywhere}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f>span{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
.f textarea{min-height:84px;resize:vertical}
.f textarea[data-f=notes]{min-height:300px}
#callnote{min-height:160px;resize:vertical}
ul.brief{margin:8px 0;padding-left:18px;font-size:13.5px;line-height:1.5}ul.brief li{margin:2px 0;overflow-wrap:anywhere}ul.brief a{color:var(--accent)}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}.daybar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fg.w2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.ck{display:flex;gap:8px;align-items:center;font-size:13px}
.ck input{width:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:8px;padding-top:8px}
.total b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.draft{width:100%;min-height:200px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--f-body);font-size:13.5px;line-height:1.5;resize:vertical}
.warns{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.warns div{border-radius:8px;padding:7px 10px;font-size:13px;background:var(--warn-soft);border:1px solid var(--warn)}
.warns div.bad{background:var(--bad-soft);border-color:var(--bad)}
.warns div.ok{background:var(--good-soft);border-color:var(--good)}
#drawer{position:fixed;inset:0;z-index:30;display:flex;justify-content:flex-end;background:rgba(10,18,15,.45)}
#drawer[hidden]{display:none}
#drawer .panel{background:var(--surface);width:min(620px,100%);height:100%;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
#drawer .ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;position:sticky;top:0;background:var(--surface);padding-block:4px 8px;z-index:2}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stages button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12.5px}
.stages button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.log{display:flex;flex-direction:column;gap:4px;font-size:12.5px;max-height:220px;overflow-y:auto}
.log div{display:flex;gap:8px}
.log time{color:var(--muted);white-space:nowrap}
#toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:13.5px}
#toast[hidden]{display:none}
#toast.bad{background:var(--bad);color:#fff}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted)}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin:3px 0}
@media (max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}.kpi.hero{grid-column:1/-1}
  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .kpi.hero b{font-size:38px}
}

(function(){
'use strict';

/* ---------- constantes métier (sources : dossiers GBI Events du 10 et 15 octobre 2026) ---------- */
const STAGES=[['a_contacter','À contacter'],['contacte','Contacté'],['repondu','Répondu'],['qualifie','Sales Ready'],['devis','Devis envoyé'],['signe','Signé'],['perdu','Perdu'],['stop','Opposition']];

  q:{pid:'',date:'',kind:'',guests:'',formule:'none',cocktail:false,vin:false,service:false,fumee:false,plancha:false,deco:'none',decoCustom:'',chaises:'',tablesRect:'',tablesRondes:'',nappes:'',kits:'',couvertsOr:'',couvertsArg:'',validated:false},
  m:{pid:'',tpl:'first',offer:'cle'},dirty:false,downloads:null};
try{S.who=localStorage.getItem('gbi_who')||'';S.view=localStorage.getItem('gbi_view')||'today'}catch(e){}

/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const main=$('#main');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');

function errMsg(e){const c=e&&e.code;if(c==='invalid_argument')return "Écriture refusée : ton compte n'est pas autorisé (table membres).";if(c==='quota_exceeded')return 'Base pleine : supprime des fiches.';if(c==='unavailable'||c==='resource_exhausted')return 'Service occupé, réessaie dans un instant.';return 'Enregistrement impossible'+(c?' ('+c+')':'')+'.'}

/* ---------- accès base ---------- */
async function save(id,patch){patch.updated=new Date().toISOString();await S.db.doc('prospects/'+id).update(patch)}

/* ---------- règles d'étape ---------- */
function weekendKey(iso){if(!iso)return null;const d=new Date(iso+'T12:00:00');const w=d.getDay();if(w!==0&&w!==6)return null;if(w===0)d.setDate(d.getDate()-1);return toISO(d)}
function conflicts(date,pid,stages){const wk=weekendKey(date);if(!wk)return [];return S.prospects.filter(x=>x.id!==pid&&stages.includes(x.stage)&&x.eventDate&&weekendKey(x.eventDate)===wk)}
function gate(q,stage){
  if(stage==='qualifie'){
    if((+q.intent||0)<2)return "Sales Ready demande une intention moyenne ou forte, avec une preuve. Un score de potentiel seul ne suffit pas.";
    if(!q.signal)return "Note le signal observé (réponse, demande de prix, date d'événement…).";
    if(!q.nextAction)return 'Indique la prochaine étape.';
    const mp=num(S.pricing.minPanier);if(mp&&num(q.budgetVal)>0&&num(q.budgetVal)<mp)return 'Budget de '+fmt(q.budgetVal)+' : sous le panier minimum de '+fmt(mp)+'. Propose le clé en main pour monter le panier, ou passe la fiche en Perdu (motif « Budget sous le minimum »).';
  }
  if(stage==='devis'&&!(+q.quoteAmount>0))return 'Renseigne le montant du devis (ou prépare-le dans Devis).';
  if(stage==='signe'){
    if(!(+q.signedAmount>0))return 'Renseigne le montant signé.';
    if(!q.eventDate)return "Renseigne la date de l'événement.";
    const c=conflicts(q.eventDate,q.id,['signe']);
    if(c.length)return 'Week-end déjà réservé par '+c[0].name+' (capacité : 1 événement par week-end). Vérifie avec Germaine.';
  }
  if(stage==='perdu'&&!q.lostReason)return 'Indique le motif de perte : il nourrit les statistiques.';
  return null;
}
async function setStage(p,stage,patch){
  patch=patch||{};
  const q={...p,...patch};
  const err=gate(q,stage);if(err){toast(err,true);return false}

  const rank=PIPE.indexOf(stage);
  if(rank>=1&&!q.firstContact)u.firstContact=now;
  if(rank>=2&&!q.repliedAt)u.repliedAt=now;
  if(rank>=3&&!q.qualifiedAt)u.qualifiedAt=now;
  if(stage==='devis'&&!q.quoteDate)u.quoteDate=now;
  if(stage==='signe'&&!q.signedDate)u.signedDate=now;
  if(stage==='stop'){u.optout=true;u.nextDate='';u.nextAction=''}
  u.log=logAdd(q,'Étape : '+STAGE_L[stage]);
  return guard(()=>save(p.id,u));
}

/* ---------- indicateurs ---------- */
function kpis(){
  const P=S.prospects,signed=P.filter(p=>p.stage==='signe');
  const quoted=P.filter(p=>p.quoteDate).length;
  const delays=signed.filter(p=>p.firstContact&&p.signedDate).map(p=>(new Date(p.signedDate)-new Date(p.firstContact))/864e5);
  const dv=P.filter(p=>p.stage==='devis');
  return {nSigned:signed.length,ca:sum(signed,p=>p.signedAmount),cashed:sum(signed,p=>p.cashedAmount),
    nDevis:dv.length,devisSum:sum(dv,p=>p.quoteAmount),nReady:P.filter(p=>p.stage==='qualifie').length,
    everQuoted:quoted,conv:quoted?Math.round(100*P.filter(p=>p.signedDate&&p.quoteDate).length/quoted)+' %':'—',
    delay:delays.length?Math.round(delays.reduce((a,b)=>a+b,0)/delays.length)+' j':'—'};
}
function funnel(P){return [['Prospects',P.length],['Contactés',P.filter(p=>p.firstContact).length],['Réponses',P.filter(p=>p.repliedAt).length],['Qualifiés',P.filter(p=>p.qualifiedAt).length],['Devis',P.filter(p=>p.quoteDate).length],['Signés',P.filter(p=>p.signedDate).length]]}

function briefOf(p){return Array.isArray(p.brief)&&p.brief.length?p.brief:(BRIEFS[p.id]||null)}
function briefHTML(p){const b=briefOf(p);if(!b)return '';return `<ul class="brief">${b.map(x=>{const m=String(x).match(/^Source : (https?:\/\/\S+)$/);return m?`<li>Source : <a href="${esc(m[1])}" target="_blank" rel="noopener">${esc(m[1].replace(/^https?:\/\/(www\.)?/,'').slice(0,60))}</a></li>`:`<li>${esc(x)}</li>`}).join('')}</ul>`}
function userNotes(p){return String(p.notes||'').split('\n').filter(l=>/^20\d\d-\d\d-\d\d/.test(l)).join('\n')}
function leadDay(p){return p.discovered||String(p.created||'').slice(0,10)}
function dayOk(p){return !S.day||leadDay(p)===S.day}
function dayBar(){const m={};S.prospects.forEach(p=>{const d=leadDay(p);if(d)m[d]=(m[d]||0)+1});const ds=Object.keys(m).sort().reverse();if(ds.length<2)return '';
  return `<div class="daybar"><label for="dayf">Leads arrivés le</label><select id="dayf" data-day="1"><option value="">Toutes les dates</option>${ds.map(d=>`<option value="${d}"${S.day===d?' selected':''}>${fdateFull(d)} (${m[d]} fiches)</option>`).join('')}</select><span class="muted sm">Date où le lead a été trouvé. Le classement dans une même journée suit la note de pertinence.</span></div>`}
/* ---------- file d'action du jour ---------- */
function queue(){
  const t=today(),out=[];
  S.prospects.forEach(p=>{
    if(['signe','perdu','stop'].includes(p.stage)||p.optout||!dayOk(p))return;
    const due=p.nextDate&&p.nextDate<=t;let b=null,label='';
    if(p.stage==='repondu'){b=0;label='Réponse à traiter'}
    else if(p.stage==='qualifie'){b=1;label='Sales Ready'}
    else if(p.stage==='devis'&&due){b=2;label='Relance devis'}
    else if(p.stage==='contacte'&&due){b=3;label='Relance'}
    else if(p.stage==='a_contacter'){b=4;label='À contacter'}
    if(b!==null)out.push({p,b,label,k:b===0?new Date(p.repliedAt||0).getTime():-pot(p)});
  });
  return out.sort((a,b)=>a.b-b.b||a.k-b.k||String(a.p.name).localeCompare(String(b.p.name)));
}
function queueItem(it){
  const p=it.p,late=p.stage==='repondu'&&hoursAgo(p.repliedAt)>2;
  const cls=it.b===0?(late?'bad':'hot'):it.b===1?'brass':it.b<=3?'warn':'';
  return `<li class="q" data-act="open" data-id="${esc(p.id)}"><div class="t">${chip(it.label+(it.b===0&&p.repliedAt?' · '+ago(p.repliedAt):''),cls)}<b>${esc(p.name)}</b><span class="muted sm">${esc(SEG_L[p.segment]||'')}${p.city?' · '+esc(p.city):''}</span></div>
  <div class="btns"><button class="btn sm" data-act="msg" data-id="${esc(p.id)}">Message</button></div>
  <div class="nx">${p.nextAction?esc(p.nextAction)+(p.nextDate?' — '+fdate(p.nextDate):''):'<span class="sm">Aucune action planifiée : ouvre la fiche.</span>'}</div></li>`;
}

function stHB(title,note,items,money,empty,keepOrder){
  const mx=Math.max(1,...items.map(x=>x[1])),tot=items.reduce((a,x)=>a+x[1],0);
  const fv=v=>money?(v>=1000?new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1}).format(v/1000)+' k€':stInt(v)+' €'):stInt(v);
  return `<section class="card${money?' money':''}"><h3 style="margin-bottom:8px">${title}</h3>${note?`<p class="note" style="margin:0 0 8px">${note}</p>`:''}${items.length?`<div class="hb">${items.map(([l,v])=>{const pct=tot?Math.round(100*v/tot):0;
    return `<div class="hbr" data-tip="${esc(l)} : ${money?fmt(v):stInt(v)} (${pct} %)"><span class="hbl">${esc(l)}</span><span class="hbt"><i style="width:${Math.max(1.5,100*v/mx)}%"></i></span><span class="hbv">${fv(v)}</span></div>`}).join('')}</div>`:`<p class="note">${empty||'Aucune donnée sur la période.'}</p>`}</section>`;
}
function stNice(m){if(m<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(m))),f=m/p;return (f<=1?1:f<=2?2:f<=4?4:f<=6?6:f<=8?8:10)*p}
function stDraw(){
  const D=S.stData;if(!D)return;
  document.querySelectorAll('.chartbox').forEach(box=>{
    const k=box.dataset.k,money=box.classList.contains('money'),vals=D.A[k],n=vals.length;
    const W=Math.max(260,box.clientWidth),H=180,L=money?58:34,R=6,T=16,B=22,pw=(W-L-R)/n,gap=2,bw=Math.max(1,pw-gap);
    const top=stNice(Math.max(...vals,0)),y=v=>T+(H-T-B)*(1-v/top),fv=v=>money?(v>=1000?new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1}).format(v/1000)+' k€':stInt(v)+' €'):stInt(v);
    let s=`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(box.dataset.label)} : ${money?fmt(stTot(vals)):stInt(stTot(vals))} sur la période">`;
    [0,.5,1].forEach(f=>{const v=top*f,yy=Math.round(y(v))+.5;s+=`<line class="gl${f?'':' base'}" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+3}" text-anchor="end">${fv(v)}</text>`});
    const step=Math.ceil(n/(W<420?5:8));let mxI=-1,mxV=0;vals.forEach((v,i)=>{if(v>mxV){mxV=v;mxI=i}});
    vals.forEach((v,i)=>{
      const x=L+i*pw+gap/2,yt=y(v),h=Math.max(0,H-B-yt),r=Math.min(4,bw/2,h);
      const tip=`${stLabel(D.keys[i],D.g,1)} : ${money?fmt(v):stInt(v)+' '+box.dataset.label.toLowerCase()}`;
      s+=`<g class="col" data-tip="${esc(tip)}">`;
      if(h>0)s+=`<path class="b" d="M${x},${H-B} V${yt+r} Q${x},${yt} ${x+r},${yt} H${x+bw-r} Q${x+bw},${yt} ${x+bw},${yt+r} V${H-B} Z"/>`;
      s+=`<rect class="hit" x="${L+i*pw}" y="${T}" width="${pw}" height="${H-T-B}"/></g>`;
      if((n-1-i)%step===0)s+=`<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${stLabel(D.keys[i],D.g)}</text>`;
      if(v>0&&(i===mxI||i===n-1)&&bw>=6)s+=`<text class="vl" x="${x+bw/2}" y="${yt-4}" text-anchor="middle">${fv(v)}</text>`;
    });
    if(!mxV)s+=`<text class="ax" x="${(L+W-R)/2}" y="${H/2}" text-anchor="middle">Aucune donnée sur la période</text>`;
    box.innerHTML=s+'</svg>';
  });
}

/* ---------- recherche globale ---------- */
const gsNorm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function gsText(p){let ph=String(p.phone||'').replace(/\D/g,'');if(/^33\d{9}$/.test(ph))ph='0'+ph.slice(2);return gsNorm([p.name,dirigeantOf(p),p.city,p.email,p.website,p.instagram,(p.brief||[]).join(' ')].join(' '))+' '+ph}
function gsSearch(q){
  const words=gsNorm(q).split(/\s+/).filter(Boolean);if(!words.length)return [];
  return S.prospects.map(p=>{const t=gsText(p),n=gsNorm(p.name);
      if(!words.every(w=>t.includes(w)))return null;
      return {p,s:(n.startsWith(words[0])?3:0)+(n.includes(words[0])?2:0)}}).filter(Boolean)
    .sort((a,b)=>b.s-a.s||String(a.p.name).localeCompare(String(b.p.name))).slice(0,8).map(x=>x.p);
}
function gsRender(){
  const q=$('#gsq').value,box=$('#gsres');if(!q.trim()){box.hidden=true;box.innerHTML='';return}
  const L=gsSearch(q);S.gsI=0;
  box.innerHTML=L.length?L.map((p,i)=>{const d=dirigeantOf(p);return `<button type="button" data-act="gsopen" data-id="${esc(p.id)}"${i===0?' class="on"':''}><b>${esc(p.name)}</b><span class="sub">${[d,p.city,STAGE_L[p.stage],hasPhone(p)?fmtPhone(p.phone):'',p.email].filter(Boolean).map(esc).join(' · ')}</span></button>`}).join(''):`<div class="none">Aucune fiche ne correspond à « ${esc(q)} ».</div>`;
  box.hidden=false;
}
document.addEventListener('input',e=>{if(e.target.id==='gsq')gsRender()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')&&$('#gsq')){e.preventDefault();$('#gsq').focus();return}
  if(e.target.id!=='gsq')return;const B=[...document.querySelectorAll('#gsres button')];
  if(e.key==='Escape'){e.target.value='';gsRender();return}
  if(!B.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();S.gsI=(S.gsI+(e.key==='ArrowDown'?1:B.length-1))%B.length;B.forEach((b,i)=>b.classList.toggle('on',i===S.gsI))}
  if(e.key==='Enter'){e.preventDefault();B[S.gsI||0].click()}
});
document.addEventListener('click',e=>{if(!e.target.closest('.gsearch')){const b=$('#gsres');if(b)b.hidden=true}});

function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split('\n')[0]||'';
  const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows;
}

  if(q.cocktail){ev=true;if(!(num(pr.cocktail)>0))W.push(['bad','Cocktail / mignardises : tarif pas encore fixé (onglet Règles). Chiffre-le avec Germaine.']);else if(!g)W.push(['bad',"Renseigne le nombre d'invités pour le cocktail."]);else add('Cocktail / mignardises',g,pr.cocktail,g*pr.cocktail)}

  if(q.service&&g){ev=true;add('Service à table',g,pr.service,g*pr.service)}
  if(q.fumee)add('Option fumée',1,pr.fumee,pr.fumee);
  if(q.plancha&&g)add('Animation plancha',g,pr.plancha,g*pr.plancha);
  if(q.deco==='custom'){ev=true;const v=num(q.decoCustom);if(v<pr.decoMin)W.push(['',"Décoration sur mesure : à partir de "+fmt(pr.decoMin)+'.']);if(v>0)add('Décoration sur mesure',1,v,v)}
  else if(q.deco&&q.deco!=='none'){ev=true;if(!wed)W.push(['bad','Les packs sont réservés aux mariages. Hors mariage : décoration sur mesure, à la carte.']);else{const v=pr['deco'+q.deco];add('Pack mariage, décoration '+q.deco+' invités',1,v,v)}}
  let hasLoc=false;
  MAT.forEach(([k,l,sk,pk])=>{const n=num(q[k]);if(!(n>0))return;hasLoc=true;add(l,n,pr[pk],n*pr[pk]);
    if(q.date){const a=avail(k,q.date,q.date,null);
      if(!a)W.push(['',l+' : stock non renseigné (onglet Matériel), vérifie à la main.']);
      else if(n>a.free)W.push(['bad',l+' : '+n+' demandé(s), '+Math.max(0,a.free)+' disponible(s) le '+fdateFull(q.date)+' (stock '+a.stock+', déjà réservé '+a.used+').'])}
    else{const st=pr[sk];if(st!=null&&n>st)W.push(['bad',l+' : '+n+' demandé(s) pour un stock total de '+st+'.'])}});
  if(hasLoc)W.push(['','Livraison de la location : non chiffrée ici. À définir avec Germaine (retrait possible par le client).']);
  const total=sum(L,x=>x.total),mp=num(pr.minPanier);
  if(ev&&mp&&total>0&&total<mp)W.push(['bad','Total '+fmt(total)+' : sous le panier minimum de '+fmt(mp)+'. Ajoute décoration, matériel ou service pour passer en clé en main, ou décline poliment.']);
  else if(!ev&&hasLoc)W.push(['','Location seule : non soumise au panier minimum événement (règle à confirmer avec Germaine).']);
  if(q.date){
    const wk=weekendKey(q.date);
    if(wk){const sg=conflicts(q.date,q.pid,['signe']),dv=conflicts(q.date,q.pid,['devis']);
      if(sg.length)W.push(['bad','Week-end déjà réservé par '+sg[0].name+' (1 événement par week-end).']);
      else if(dv.length)W.push(['','Un devis est déjà en cours pour ce week-end : '+dv[0].name+'.']);
      else W.push(['ok','Aucun événement signé ce week-end dans la base. Disponibilité à confirmer avec Germaine.'])}
    else W.push(['','Date en semaine : capacité non confirmée, à vérifier avec Germaine.']);
  }else W.push(['','Sans date, la disponibilité ne peut pas être vérifiée.']);
  return {L,W,total,hasLoc};
}

  return `<section class="card"><h2>D'où viennent les ventes</h2><p class="note">Le canal d'une fiche = l'endroit d'où vient le client : la prospection (on va vers lui) ou un canal entrant (il vient vers nous : site, Google, Meta, Instagram, Leboncoin, bouche-à-oreille…). Il se choisit à la création de la fiche ; plus tard, Make le remplira tout seul. Chaque vente est rattachée au canal de sa fiche : c'est ce qui permet de savoir quel canal pousser et lequel couper. Les dépenses se saisissent à la main par canal (budget pub visé : 400 à 500 € par mois).</p>
  ${rows.length?`<div class="scroll-x"><table class="t"><thead><tr><th>Canal</th><th>Verdict</th><th class="r">Prospects</th><th class="r">Contactés</th><th class="r">Réponses</th><th class="r">Qualifiés</th><th class="r">Devis</th><th class="r">Ventes</th><th class="r">CA signé</th><th class="r">Part du CA</th><th class="r">Dépense €</th><th class="r">€/qualifié</th><th class="r">€/devis</th><th class="r">€/vente</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="empty">Aucune donnée par canal pour l\'instant.</div>'}
  <p class="note" style="margin-top:8px">Repères du verdict, à ajuster avec Germaine selon sa marge : au moins 3 € de CA par € dépensé = à pousser ; entre 1 et 3 = à optimiser ; moins de 1 = à couper ou revoir. Un canal sans vente n'est jugé qu'après 30 personnes contactées.</p></section>
  <div class="grid2" style="margin-top:14px"><section class="card"><h3>Prévision</h3>${fc}<p class="note">Formules : ventes = opportunités actives × taux observé ; CA = ventes × panier moyen observé.</p></section>
  <section class="card"><h3>Comment renseigner le canal</h3><ul class="plain"><li><b>Prospection</b> : les entreprises trouvées par la recherche automatique, puis appelées ou contactées par email. C'est nous qui allons vers elles.</li><li><b>Canaux entrants</b> (site, fiche Google, Google Ads, Meta Ads, Instagram, Leboncoin, WhatsApp, contact direct) : le client vient vers nous. La fiche arrive directement au statut « Répondu », à traiter sous 2 h.</li><li><b>Bouche-à-oreille et partenaires</b> : un client ou un partenaire nous recommande. Demande toujours « Comment nous avez-vous connus ? » au premier échange.</li><li>Leads Meta : export CSV du formulaire, puis « Importer CSV ».</li><li>Juge chaque canal sur le coût par devis et par vente, pas sur les clics.</li></ul><p class="note">Pas encore automatique : la remontée directe des formulaires et messages, et l'alerte Telegram à chaque demande de devis, se construisent dans Make (étape suivante).</p></section></div>`;
}

function resLate(x){return x.status==='sortie'&&(x.end||x.start)<today()}
function resSorted(L){return L.slice().sort((a,b)=>String(a.start).localeCompare(String(b.start))||String(a.client).localeCompare(String(b.client)))}
function matAlerts(){const t=today();return S.reservations.filter(x=>resLate(x)||x.status==='demande'||(['option','confirmee'].includes(x.status)&&x.start&&x.start<=addDays(t,2))).length}
function matCheck(items,start,end,exclude){
  const L=MAT.filter(([k])=>num((items||{})[k])>0).map(([k,l,sk,pk])=>{const n=num(items[k]),a=avail(k,start,end||start,exclude);return {k,l,n,a,ok:!!a&&n<=a.free,price:n*num(S.pricing[pk])}});
  return {L,miss:L.filter(x=>x.a&&!x.ok),unk:L.filter(x=>!x.a)};
}
function resRow(x){
  const late=resLate(x);
  const btn=(st,l,c='')=>`<button class="btn sm ${c}" data-act="rstatus" data-id="${esc(x.id)}" data-st="${st}" data-write>${l}</button>`;
  let acts='';
  if(x.status==='demande')acts=btn('option','Bloquer (option)','primary')+btn('annulee','Annuler');
  else if(x.status==='option')acts=btn('confirmee','Confirmer','primary')+btn('annulee','Annuler');
  else if(x.status==='confirmee')acts=btn('sortie','Matériel sorti','primary')+btn('annulee','Annuler');
  else if(x.status==='sortie')acts=`<span class="sm muted">Quantités rendues :</span> ${MAT.filter(([k])=>num((x.items||{})[k])>0).map(([k,l])=>`<label class="sm">${esc(l)} <input id="ret-${esc(x.id)}-${k}" inputmode="numeric" value="${num(x.items[k])}" style="width:60px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px"></label>`).join(' ')} <button class="btn sm primary" data-act="rreturn" data-id="${esc(x.id)}" data-write>Valider le retour</button>`;
  const miss=x.missing&&Object.keys(x.missing).some(k=>num(x.missing[k])>0)?`<div class="sm" style="color:var(--bad)">Manquant au retour : ${esc(itemsTxt(x.missing))}</div>`:'';
  const cls=late?'bad':x.status==='demande'?'warn':x.status==='sortie'?'brass':BLOCKING.includes(x.status)?'hot':x.status==='rendue'?'good':'off';
  return `<div class="card" style="padding:10px 12px;margin-top:8px"><div class="t" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${chip(late?'En retard':RSTAT_L[x.status]||x.status,cls)}<b>${esc(x.client||'Sans nom')}</b><span class="muted sm">${fdateFull(x.start)}${x.end&&x.end!==x.start?' → '+fdateFull(x.end):''}${x.phone?' · '+esc(fmtPhone(x.phone)):''}${x.channel?' · '+esc(CH_L[x.channel]||x.channel):''}</span></div>
   <div class="sm" style="margin:4px 0">${esc(itemsTxt(x.items))}${x.note?' · <span class="muted">'+esc(x.note)+'</span>':''}</div>${miss}
   <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${acts}</div></div>`;
}

const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
function matLevel(a){if(!a)return {cls:'unk',pct:null,label:'Stock inconnu'};const pct=a.stock>0?Math.max(0,Math.round(100*a.free/a.stock)):0;
  return a.free<=0?{cls:'full',pct:0,label:'Complet'}:a.used<=0?{cls:'ok',pct:100,label:'100 % libre'}:{cls:'part',pct,label:pct+' % libre'}}
function matBar(a){const L=matLevel(a);if(L.pct==null)return '<span class="muted sm">Stock inconnu</span>';
  return `<span class="mbar" aria-hidden="true"><i class="${L.cls==='ok'?'':L.cls}" style="width:${L.pct}%"></i></span><b style="color:${L.cls==='full'?'var(--bad)':L.cls==='part'?'var(--warn)':'var(--good)'}">${L.label}</b>`}

    return `<td class="c ${L.cls}" data-tip="${esc(tip)}">${L.cls==='full'?'✕':L.cls==='part'?L.pct:L.cls==='unk'?'?':''}</td>`}).join('')}</tr>`).join('');

   <p class="note" style="margin-top:6px">Passe la souris (ou touche) une case pour voir le nombre exact. Compte le matériel en option, confirmé ou sorti et pas encore rendu.</p></section>`;

function updateMat(){
  const out=$('#rout');if(!out)return;const r=S.r;
  if(!r.start){out.innerHTML='<div class="warns"><div>Indique la date de retrait pour vérifier le stock.</div></div>';return}
  if(r.end&&r.end<r.start){out.innerHTML='<div class="warns"><div class="bad">La date de retour est avant la date de retrait.</div></div>';return}
  const c=matCheck(r.items,r.start,r.end||r.start,null);
  if(!c.L.length){out.innerHTML='<div class="warns"><div>Ajoute au moins une quantité.</div></div>';return}
  const v=c.miss.length?`<div class="bad">Impossible de tout fournir sur cette période : ${c.miss.map(x=>x.l.toLowerCase()+' (manque '+(x.n-Math.max(0,x.a.free))+')').join(', ')}. Propose une autre date ou une quantité réduite.</div>`
    :c.unk.length?`<div>Stock inconnu pour ${c.unk.map(x=>x.l.toLowerCase()).join(', ')} : vérifie à la main avant de confirmer.</div>`

  <div class="fg w2">${I('Nom','name')}${SEL('Segment','segment',SEGMENTS)}${SEL('Canal','channel',CHANNELS)}${SEL('Offre d\'entrée','offer',OFFERS)}${SEL("Type d'événement",'eventKind',EVENT_KINDS)}
   ${I('Ville','city')}${I('Site web','website','text')}${I('Email professionnel','email','text')}${I('Téléphone','phone','text')}${I('Instagram','instagram')}${SEL('Responsable','owner',[['Kissima','Kissima'],['Germaine','Germaine']])}
   ${I('Source','source')}${I('URL de la preuve','proof')}</div>
  <div class="sec-label">Qualification</div>
  <div class="fg w2">${SEL('Intention d\'achat','intent',INTENT.map((l,i)=>[i,l]))}${I('Signal observé (preuve)','signal')}</div>
  <div class="fg" style="margin-top:8px">${SCORE.map(([k,l,w])=>`<label class="ck"><input type="checkbox" data-sc="${k}"${p.score&&p.score[k]?' checked':''}> ${l} (+${w})</label>`).join('')}</div>
  <label class="ck" style="margin-top:8px"><input type="checkbox" data-f="explicit"${p.explicit?' checked':''}> Demande explicite du prospect (obligatoire pour un particulier)</label>
  <div class="fg w2" style="margin-top:8px">${I('Prochaine action','nextAction')}${I('Date de la prochaine action','nextDate','date')}</div>
  <div class="sec-label">Événement et montants</div>
  <div class="fg">${I("Date de l'événement",'eventDate','date')}${I('Invités','guests','text','inputmode="numeric"')}${SEL('Budget','budget',[['inconnu','Inconnu'],['estimé','Estimé'],['confirmé','Confirmé']])}${I('Montant du budget (€)','budgetVal','text','inputmode="decimal"')}
   ${I('Devis (€)','quoteAmount','text','inputmode="decimal"')}${I('Signé (€)','signedAmount','text','inputmode="decimal"')}${I('Encaissé (€)','cashedAmount','text','inputmode="decimal"')}${I('Motif de perte','lostReason')}</div>
  ${cf.length?`<div class="warns"><div class="bad">Week-end déjà réservé par ${esc(cf[0].name)}.</div></div>`:''}
  ${num(p.budgetVal)>0&&num(p.budgetVal)<num(S.pricing.minPanier)?`<div class="warns"><div class="bad">Budget sous le panier minimum de ${fmt(S.pricing.minPanier)} : propose le clé en main pour monter le panier, ou passe en Perdu.</div></div>`:''}
  ${p.offer==='pack'&&p.eventKind&&p.eventKind!=='mariage'?`<div class="warns"><div class="bad">Les packs sont réservés aux mariages. Choisis une autre offre d'entrée.</div></div>`:''}
  <label class="f"><span>Notes</span><textarea data-f="notes">${esc(p.notes||'')}</textarea></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="save" data-write>Enregistrer</button>
   ${D.id?`<button class="btn" data-act="msg" data-id="${esc(p.id)}">Message</button><button class="btn" data-act="quoteopen" data-id="${esc(p.id)}">Devis</button>
   <button class="btn danger" data-act="stage" data-st="stop" data-write>Opposition reçue</button>
   <button class="btn danger" data-act="${S.confirmDel===p.id?'delok':'del'}" data-write>${S.confirmDel===p.id?'Confirmer la suppression':'Supprimer'}</button>`:''}</div>
  ${D.id?`<div class="sec-label">Journal</div><label class="f"><span>Ajouter une note au journal</span><input id="lognote" placeholder="Ex. : appelé, répondeur ; rappel jeudi"></label><p><button class="btn sm" data-act="lognote" data-write>Ajouter</button></p>
   <div class="log">${hist.length?hist.map(h=>`<div><time>${fdate(h.t)} ${String(h.t).slice(11,16)}</time><span><b>${esc(h.by)}</b> ${esc(h.x)}</span></div>`).join(''):'<span class="muted">Aucun historique.</span>'}</div>`:''}</div>`;
}
function collect(){
  const P={score:{}};
  document.querySelectorAll('#drawer [data-f]').forEach(el=>{const n=el.dataset.f;let v;
    if(el.type==='checkbox')v=el.checked;else v=el.value.trim();
    if(['guests','quoteAmount','signedAmount','cashedAmount','budgetVal'].includes(n))v=v===''?'':num(v);
    if(n==='intent')v=Number(v)||0;P[n]=v});
  document.querySelectorAll('#drawer [data-sc]').forEach(el=>{P.score[el.dataset.sc]=el.checked});
  return P;
}
function openDrawer(id){S.drawer={id:id||null};S.confirmDel=null;const d=$('#drawer');d.innerHTML=drawerHTML();d.hidden=false}
function closeDrawer(){S.drawer=null;S.confirmDel=null;const d=$('#drawer');d.hidden=true;d.innerHTML='';if(S.dirty)refresh()}
function reDrawer(){if(!S.drawer)return;const d=$('#drawer'),sc=d.querySelector('.panel')?d.querySelector('.panel').scrollTop:0;d.innerHTML=drawerHTML();const pn=d.querySelector('.panel');if(pn)pn.scrollTop=sc}

/* ---------- rendu général ---------- */
function renderTabs(){
  const n=queue().length;
  const T=[['today','Aujourd\'hui',n],['calls','Appels',callQueue().length||''],['nophone','Sans téléphone',noPhoneList().length||''],['prospects','Prospects'],['stats','Statistiques'],['quote','Devis'],['materiel','Matériel',matAlerts()||''],['messages','Messages'],['channels','Canaux'],['rules','Règles']];
  $('#tabs').innerHTML=T.map(([k,l,c])=>`<button data-act="tab" data-v="${k}"${S.view===k?' aria-current="page"':''}>${l}${c?`<span class="n">${c}</span>`:''}</button>`).join('');
  const w=$('#who');w.innerHTML=`<option value="">— choisir —</option><option${S.who==='Kissima'?' selected':''}>Kissima</option><option${S.who==='Germaine'?' selected':''}>Germaine</option>`;
}
function banners(){
  let h='';
  if(S.offline)h+=`<div class="banner bad">Connexion à la base impossible. Vérifie ta connexion internet, puis recharge la page.</div>`;
  else if(S.err)h+=`<div class="banner bad">Base partagée : lecture impossible (${esc(S.err)}). Reconnecte-toi et recharge la page.</div>`;
  else if(S.db&&!S.canWrite)h+=`<div class="banner">Lecture seule : ton compte n'a pas le droit de modifier. Demande à Germaine de t'ajouter comme membre.</div>`;
  $('#banners').innerHTML=h;
  const on=!!S.db&&!S.err;$('#sync .dot').className='dot '+(on?(S.canWrite?'on':''):'off');
  $('#synctext').textContent=S.offline?'Hors ligne':S.err?'Erreur':!S.db?'Connexion…':S.canWrite?'Base partagée':'Lecture seule';
}
function render(){
  if(S.view==='pipeline'){S.view='prospects';S.pview='etapes'}
  if(S.pview===undefined){try{S.pview=localStorage.getItem('gbi_pview')||'liste'}catch(e){S.pview='liste'}}
  renderTabs();banners();
  main.innerHTML=(VIEWS[S.view]||VIEWS.today)();
  if(S.view==='quote')updateQuote();if(S.view==='messages')updateMsg();if(S.view==='materiel')updateMat();if(S.view==='stats')stDraw();
  $('#app').classList.toggle('ro',!S.canWrite);S.dirty=false;
}
function refresh(){
  const a=document.activeElement;
  if(a&&main.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){S.dirty=true;renderTabs();return}
  render();
}

/* ---------- événements ---------- */
const ACT={
  pview(t){S.pview=t.dataset.pv;try{localStorage.setItem('gbi_pview',S.pview)}catch(e){}render()},
  tab(t){S.view=t.dataset.v;try{localStorage.setItem('gbi_view',S.view)}catch(e){}render();window.scrollTo(0,0)},
  stg(t){stState().g=t.dataset.g;try{localStorage.setItem('gbi_stg',t.dataset.g)}catch(e){}render()},
  stcsv(){stCSV()},
  stclear(){const s=stState();s.from='';s.to='';render()},
  matcal(t){const d=+t.dataset.d;S.matCal=d?addDays(S.matCal||today(),d):today();render()},
  gsopen(t){$('#gsres').hidden=true;$('#gsq').value='';openDrawer(t.dataset.id)},
  help(){openHelp()},
  helpclose(){closeHelp()},
  open(t){openDrawer(t.dataset.id)},
  newp(){openDrawer(null)},
  close(){closeDrawer()},
  showall(){S.showAll=!S.showAll;render()},
  importtoggle(){S.showImport=!S.showImport;render()},
  async importrun(){let txt=$('#imptext').value;const f=$('#impfile').files[0];if(f)txt=await f.text();if(!txt.trim()){$('#impres').textContent='Colle du contenu ou choisis un fichier.';return}await runImport(txt)},
  export(){exportCSV()},
  async save(){
    const patch=collect();if(!patch.name){toast('Le nom est obligatoire.',true);return}
    const D=S.drawer;
    if(D.id){const p=byId(D.id);patch.log=logAdd(p,'Fiche modifiée');if(await guard(()=>save(D.id,patch))){toast('Fiche enregistrée.');reDrawer()}}
    else{
      const now=new Date().toISOString(),d={...blank(),...patch,created:now,updated:now,log:[{t:now,by:S.who||'—',x:'Fiche créée'}]};
      if(INBOUND.includes(d.channel)){d.stage='repondu';d.repliedAt=now;d.firstContact=now;d.explicit=true;d.intent=d.intent||1;d.signal=d.signal||'Demande reçue';if(!d.nextAction){d.nextAction='Répondre sous 2 h et qualifier le besoin';d.nextDate=today()}}
      if(!d.nextAction){d.nextAction='Envoyer le 1er message';d.nextDate=today()}
      if(await guard(()=>S.db.collection('prospects').add(d))){toast('Prospect ajouté.');closeDrawer()}
    }
  },
  async stage(t){const D=S.drawer;if(!D||!D.id)return;const p=byId(D.id),patch=collect();if(await setStage(p,t.dataset.st,patch)){toast('Étape : '+STAGE_L[t.dataset.st]);reDrawer()}},
  async lognote(){const D=S.drawer,v=$('#lognote').value.trim();if(!D||!D.id||!v)return;const p=byId(D.id);if(await guard(()=>save(D.id,{log:logAdd(p,v),lastContact:new Date().toISOString()}))){reDrawer()}},
  del(){S.confirmDel=S.drawer.id;reDrawer()},
  async delok(){const id=S.drawer.id;if(await guard(()=>S.db.doc('prospects/'+id).delete())){toast('Fiche supprimée.');closeDrawer()}},
  msg(t,e){e.stopPropagation();S.m.pid=t.dataset.id;if(S.drawer)closeDrawer();S.view='messages';const p=byId(t.dataset.id);if(p){S.m.tpl=p.stage==='repondu'?'reply':p.stage==='contacte'?'follow':['reco','partenaire'].includes(p.channel)?'network':'first';S.m.offer=p.offer||'partenariat'}render()},
  async callres(t){await callResult(t.dataset.r)},
  callskip(){if(S.call.pid)S.call.skip.push(S.call.pid);S.call.pid='';render()},
  async phonesave(t){const el=document.getElementById('ph-'+t.dataset.id);const v=el?el.value.trim():'';if(String(v).replace(/\D/g,'').length<9){toast('Numéro invalide.',true);return}const p=byId(t.dataset.id);if(await guard(()=>save(p.id,{phone:v,log:logAdd(p,'Téléphone ajouté')})))toast('Numéro enregistré.')},
  quoteopen(t){const p=byId(t.dataset.id);S.q.pid=t.dataset.id;if(p){S.q.kind=p.eventKind||'';if(p.eventDate)S.q.date=p.eventDate;if(p.guests)S.q.guests=String(p.guests)}closeDrawer();S.view='quote';render()},
  async copy(t){const el=document.getElementById(t.dataset.from);if(!el)return;try{await navigator.clipboard.writeText(el.value);toast('Copié.')}catch(e){el.focus();el.select();toast('Sélectionné : copie avec Ctrl/Cmd + C.')}},
  qsave(){saveQuote()},
  async rsave(t){
    const r=S.r,st=t.dataset.st;
    if(!r.client.trim()){toast('Indique le nom du client.',true);return}
    if(!r.start){toast('Indique la date de retrait.',true);return}
    const items={};MAT.forEach(([k])=>{const n=num(r.items[k]);if(n>0)items[k]=n});
    if(!Object.keys(items).length){toast('Ajoute au moins une quantité.',true);return}
    if(st==='option'){const c=matCheck(items,r.start,r.end||r.start,null);if(c.miss.length||c.unk.length){toast('Stock insuffisant ou inconnu : impossible de bloquer.',true);return}}
    if(await addReservation({client:r.client.trim(),phone:r.phone.trim(),channel:r.channel,start:r.start,end:r.end||r.start,note:r.note.trim(),items,status:st})){
      toast(st==='option'?'Matériel bloqué.':'Demande enregistrée (rien n\'est bloqué).');S.r={client:'',phone:'',channel:r.channel,start:'',end:'',note:'',items:{}};render()}
  },
  async rstatus(t){
    const x=S.reservations.find(y=>y.id===t.dataset.id),st=t.dataset.st;if(!x)return;
    if(BLOCKING.includes(st)&&!BLOCKING.includes(x.status)){const c=matCheck(x.items,x.start,x.end,x.id);if(c.miss.length){toast('Plus assez de stock sur cette période : '+c.miss.map(y=>y.l.toLowerCase()).join(', ')+'.',true);return}if(c.unk.length)toast('Stock inconnu pour '+c.unk.map(y=>y.l.toLowerCase()).join(', ')+' : vérifie à la main.',true)}
    const now=new Date().toISOString(),u={status:st,updated:now,log:[...(x.log||[]).slice(-29),{t:now,by:S.who||'—',x:'Statut : '+RSTAT_L[st]}]};if(st==='sortie')u.outAt=now;
    if(await guard(()=>S.db.doc('reservations/'+x.id).update(u)))toast(RSTAT_L[st]+'.');
  },
  async rreturn(t){
    const x=S.reservations.find(y=>y.id===t.dataset.id);if(!x)return;
    const returned={},missing={};let lost=false;
    MAT.forEach(([k])=>{const sent=num((x.items||{})[k]);if(!(sent>0))return;const el=document.getElementById('ret-'+x.id+'-'+k);const back=Math.max(0,Math.min(sent,el?num(el.value):sent));returned[k]=back;if(sent-back>0){missing[k]=sent-back;lost=true}});
    const now=new Date().toISOString();
    const ok=await guard(()=>S.db.doc('reservations/'+x.id).update({status:'rendue',returnedAt:now,updated:now,returned,missing,log:[...(x.log||[]).slice(-29),{t:now,by:S.who||'—',x:'Rendue'+(lost?' avec manquants : '+itemsTxt(missing):'')}]}));
    if(!ok)return;
    if(lost){const u={...S.pricing};MAT.forEach(([k,,sk])=>{if(missing[k]&&u[sk]!=null)u[sk]=Math.max(0,num(u[sk])-missing[k])});if(await guard(()=>S.db.doc('settings/pricing').set(u)))toast('Retour enregistré. Stock réduit : '+itemsTxt(missing)+'.')}
    else toast('Retour complet enregistré.');
  },
  async qreserve(){
    const q=S.q,p=byId(q.pid);if(!p||!q.date)return;
    const items={};MAT.forEach(([k])=>{const n=num(q[k]);if(n>0)items[k]=n});
    const c=matCheck(items,q.date,q.date,null),st=c.miss.length||c.unk.length?'demande':'option';
    if(await addReservation({client:p.name,phone:p.phone||'',channel:p.channel||'',prospectId:p.id,start:q.date,end:q.date,note:'Depuis le devis',items,status:st}))
      toast(st==='option'?'Matériel bloqué pour '+p.name+'.':'Stock insuffisant ou inconnu : enregistré en simple demande (onglet Matériel).',st!=='option');
  },
  sent(){markSent()},
  async pricesave(){const u={...S.pricing};document.querySelectorAll('[data-price]').forEach(el=>{const v=el.value.trim();u[el.dataset.price]=v===''?null:num(v)});if(await guard(()=>S.db.doc('settings/pricing').set(u)))toast('Enregistré.')}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  if(t.classList.contains('q')||t.classList.contains('pc')||t.classList.contains('row')){if(e.target.closest('button')&&e.target.closest('button')!==t){const b=e.target.closest('button');if(b.dataset.act&&ACT[b.dataset.act]){ACT[b.dataset.act](b,e);return}}}
  const f=ACT[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter){S.f[t.dataset.filter]=t.value;const l=$('#plist');if(l)l.innerHTML=listHTML();return}
  if(t.dataset.q&&t.type!=='checkbox'&&t.tagName!=='SELECT'){S.q[t.dataset.q]=t.value;updateQuote()}
  if(t.dataset.r){S.r[t.dataset.r]=t.value;updateMat()}
  if(t.dataset.ri){S.r.items[t.dataset.ri]=t.value;updateMat()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='who'){S.who=t.value;try{localStorage.setItem('gbi_who',S.who)}catch(x){}if(S.view==='messages')updateMsg();return}
  if(t.dataset.stf){stState()[t.dataset.stf]=t.value;render();return}
  if(t.dataset.r){S.r[t.dataset.r]=t.value;updateMat();return}
  if(t.dataset.matday){S.matDay=t.value;if(S.matEnd&&S.matEnd<t.value)S.matEnd=t.value;render();return}
  if(t.dataset.matend){S.matEnd=t.value;render();return}
  if(t.dataset.matcal){S.matCal=t.value||today();render();return}
  if(t.dataset.day){S.day=t.value;S.call.pid='';S.showAll=false;render();return}
  if(t.dataset.filter){S.f[t.dataset.filter]=t.value;const l=$('#plist');if(l)l.innerHTML=listHTML();return}
  if(t.dataset.q){
    const k=t.dataset.q;S.q[k]=t.type==='checkbox'?t.checked:t.value;
    if(k==='kind'){if(S.q.kind!=='mariage'&&/^\d+$/.test(String(S.q.deco)))S.q.deco='none';render();return}
    if(k==='pid'){const p=byId(t.value);if(p){S.q.kind=p.eventKind||'';if(p.eventDate)S.q.date=p.eventDate;if(p.guests)S.q.guests=String(p.guests)}render();return}
    updateQuote();return}
  if(t.dataset.m){S.m[t.dataset.m]=t.value;
    if(t.dataset.m==='pid'){const p=byId(t.value);if(p){S.m.tpl=p.stage==='repondu'?'reply':p.stage==='contacte'?'follow':['reco','partenaire'].includes(p.channel)?'network':'first';S.m.offer=p.offer||S.m.offer;render();return}}
    updateMsg();return}
  if(t.dataset.spend){const v=num(t.value);guard(()=>S.db.doc('spend/'+t.dataset.spend).set({amount:v}))}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(S.dirty){const a=document.activeElement;if(!(a&&main.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render()}},120)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.drawer)closeDrawer()});
$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});

/* ---------- démarrage ---------- */
async function boot(){
  render();
  const c=window.claude;
  if(!c||!c.use){S.offline=true;S.loaded=true;render();return}
  try{
    const [db,user,dl]=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')]);
    S.downloads=dl||null;
    if(!db){S.offline=true;S.loaded=true;render();return}
    S.db=db;
    if(user){try{const w=await user.can('data.write');if(w===false)S.canWrite=false}catch(e){}}
    db.collection('prospects').limit(1000).onSnapshot(snap=>{S.prospects=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;S.err='';refresh();banners()},e=>{S.err=(e&&e.code)||'inconnue';S.loaded=true;render()});
    db.doc('settings/pricing').onSnapshot(s=>{const d=s.exists?s.data():{};S.pricing={...DEF_PRICE,...d};refresh()},()=>{});
    db.collection('reservations').limit(1000).onSnapshot(snap=>{S.reservations=snap.docs.map(d=>({id:d.id,...d.data()}));refresh()},()=>{});
    db.collection('spend').onSnapshot(snap=>{S.spend={};snap.docs.forEach(d=>{S.spend[d.id]=Number(d.data().amount)||0});refresh()},()=>{});
    render();
  }catch(e){S.err=(e&&e.code)||'inconnue';S.loaded=true;render()}
}
window.__gbiBoot=boot;
})();
</script>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ---------- couche Supabase : remplace window.claude (db, user, downloads) ---------- */
(function(){
'use strict';
const HASH0=location.hash||'';
const cfg=window.GBI_CONFIG||{};
const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
window.gbiSupabase=sb;
const toErr=e=>{const m=(e&&e.message)||'';if((e&&e.code)==='42501'||/row-level security|permission denied/i.test(m))return {code:'invalid_argument',message:m};return {code:'unavailable',message:m}};
const snapOf=rows=>({docs:(rows||[]).map(r=>({id:r.id,data:()=>r.data||{}}))});
function watch(table,filter,load){
  let t=null;const go=()=>{clearTimeout(t);t=setTimeout(load,250)};
  const opts={event:'*',schema:'public',table};if(filter)opts.filter=filter;
  sb.channel('rt-'+table+'-'+Math.random().toString(36).slice(2)).on('postgres_changes',opts,go).subscribe();
  setInterval(load,120000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)go()});
}
function newId(){const u=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));return u.replace(/-/g,'').slice(0,20)}
function collection(table){
  const q={n:1000,limit(n){q.n=n;return q},
    onSnapshot(cb,onErr){
      const load=async()=>{const {data,error}=await sb.from(table).select('id,data').order('id').limit(q.n);if(error){onErr&&onErr(toErr(error));return}cb(snapOf(data))};
      load();watch(table,null,load)},
    async add(obj){const id=newId();const {error}=await sb.from(table).insert({id,data:obj});if(error)throw toErr(error);return {id}}};
  return q}
function doc(path){
  const i=path.indexOf('/'),table=path.slice(0,i),id=path.slice(i+1);
  const one=async()=>{const {data,error}=await sb.from(table).select('data').eq('id',id).maybeSingle();if(error)throw toErr(error);return {exists:!!data,id,data:()=>data?(data.data||{}):{}}};
  return {id,path,get:one,
    async set(obj){const {error}=await sb.from(table).upsert({id,data:obj});if(error)throw toErr(error)},
    async update(patch){const {error}=await sb.rpc('fusion_doc',{t:table,doc_id:id,patch});if(error)throw toErr(error)},
    async delete(){const {error}=await sb.from(table).delete().eq('id',id);if(error)throw toErr(error)},
    onSnapshot(cb,onErr){const load=async()=>{try{cb(await one())}catch(e){onErr&&onErr(e)}};load();watch(table,'id=eq.'+id,load)}}}
const downloads={async save({filename,data}){
  const b=data instanceof Blob?data:new Blob([data],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}};
let canWrite=true;
const user={async can(){return canWrite}};
window.claude={use:async n=>n==='db'?{collection,doc}:n==='user'?user:n==='downloads'?downloads:null};

/* ---------- connexion ---------- */
const $=s=>document.querySelector(s);
const msg=(t,c)=>{const m=$('#lgmsg');m.textContent=t||'';m.className='msg '+(c||'')};
let mode='login';
function setMode(m){mode=m;
  $('#lgpwdrow').hidden=m!=='login';$('#lgnewrow').hidden=!(m==='newpwd'||m==='signup');$('#lgnew2row').hidden=!(m==='newpwd'||m==='signup');$('#lgshowrow').hidden=m==='forgot';$('#lgmail').closest('label').hidden=m==='newpwd';
  $('#lgforgot').hidden=m!=='login';$('#lgsignup').hidden=m!=='login';
  $('#lgbtn').textContent=m==='login'?'Se connecter':m==='forgot'?'Recevoir le lien':m==='signup'?'Créer mon accès':'Enregistrer mon mot de passe';
  $('#lgintro').textContent=m==='login'?"Connecte-toi avec l'email de ton invitation.":m==='forgot'?'Saisis ton email : tu recevras un lien pour choisir un nouveau mot de passe.':m==='signup'?"Réservé aux membres de GBI Events : saisis ton email et choisis un mot de passe. Tu recevras un email de confirmation.":'Choisis ton mot de passe pour les prochaines connexions.';
  msg('')}
async function enter(session){
  const email=(session.user.email||'').toLowerCase();
  const {data:mb,error}=await sb.from('membres').select('email,nom,role').limit(50);
  const me=(mb||[]).find(x=>(x.email||'').toLowerCase()===email);
  if(error||!me){msg("Ton compte ("+email+") n'est pas encore autorisé. Demande à Germaine de l'ajouter dans la table membres.",'bad');setMode('login');return}
  canWrite=true;
  try{const nom=/germaine/i.test(me.nom||'')?'Germaine':/kissima/i.test(me.nom||email)?'Kissima':'';if(nom&&!localStorage.getItem('gbi_who'))localStorage.setItem('gbi_who',nom)}catch(e){}
  document.body.classList.add('authed');
  if(window.__gbiBoot&&!window.__gbiStarted){window.__gbiStarted=true;window.__gbiBoot()}
  setTimeout(()=>{const w=document.getElementById('who');let nom='';try{nom=localStorage.getItem('gbi_who')||''}catch(e){}if(w&&nom&&!w.value){w.value=nom;w.dispatchEvent(new Event('change',{bubbles:true}))}},300);
}
$('#lgform').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#lgbtn');b.disabled=true;
  try{
    if(mode==='login'){
      const {data,error}=await sb.auth.signInWithPassword({email:$('#lgmail').value.trim(),password:$('#lgpwd').value});
      if(error){msg(/invalid/i.test(error.message)?'Email ou mot de passe incorrect.':error.message,'bad');return}
      await enter(data.session);
    }else if(mode==='forgot'){
      const {error}=await sb.auth.resetPasswordForEmail($('#lgmail').value.trim(),{redirectTo:location.origin+location.pathname});
      msg(error?error.message:'Lien envoyé : ouvre ton email.',error?'bad':'ok');
    }else if(mode==='signup'){
      const p=$('#lgnew').value;if(p.length<8){msg('8 caractères minimum.','bad');return}
      if(p!==$('#lgnew2').value){msg('Les deux mots de passe ne sont pas identiques.','bad');return}
      const {data,error}=await sb.auth.signUp({email:$('#lgmail').value.trim(),password:p,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error){msg(/not allowed|disabled/i.test(error.message)?"Les accès se créent sur invitation : demande à Germaine.":error.message,'bad');return}
      if(data.session){await enter(data.session);return}
      msg("Email de confirmation envoyé : clique sur le lien reçu, puis reviens te connecter ici.",'ok');setMode('login');msg("Email de confirmation envoyé : clique sur le lien reçu, puis reviens te connecter ici.",'ok');
    }else{
      const p=$('#lgnew').value;if(p.length<8){msg('8 caractères minimum.','bad');return}
      if(p!==$('#lgnew2').value){msg('Les deux mots de passe ne sont pas identiques.','bad');return}
      const {error}=await sb.auth.updateUser({password:p});
      if(error){msg(error.message,'bad');return}
      history.replaceState(null,'',location.pathname);
      const {data}=await sb.auth.getSession();if(data.session)await enter(data.session);
    }
  }finally{b.disabled=false}
});
$('#lgforgot').addEventListener('click',()=>setMode('forgot'));
$('#lgsignup').addEventListener('click',()=>setMode('signup'));
$('#lgshow').addEventListener('change',e=>{['#lgpwd','#lgnew','#lgnew2'].forEach(id=>{$(id).type=e.target.checked?'text':'password'})});
['#lgnew','#lgnew2'].forEach(id=>$(id).addEventListener('input',()=>{const a=$('#lgnew').value,b=$('#lgnew2').value;if(b&&(mode==='signup'||mode==='newpwd'))msg(a===b?'Les mots de passe correspondent.':'Les mots de passe ne correspondent pas encore.',a===b?'ok':'bad')}));
document.addEventListener('click',async e=>{if(e.target&&e.target.id==='logout'){await sb.auth.signOut();try{localStorage.removeItem('gbi_who')}catch(x){}location.replace(location.pathname)}});
sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')setMode('newpwd')});
(async()=>{
  setMode('login');
  if(!cfg.url||!cfg.key){msg('Configuration manquante (config.js).','bad');return}
  const {data}=await sb.auth.getSession();
  if(data.session&&/type=(invite|recovery)/.test(HASH0)){setMode('newpwd');return}
  if(data.session)await enter(data.session);
})();
})();
</script>
</body></html>
